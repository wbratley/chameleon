service imap-login {
  inet_listener imap {
    port = 143
  }
  # No imaps listener: 10-ssl.conf sets ssl = no (no certs provisioned on the
  # home server), so an SSL listener on 993 could never come up. Clients use
  # plaintext IMAP on 143 over a trusted network; add a listener + ssl_cert
  # here if you later want TLS.
}
